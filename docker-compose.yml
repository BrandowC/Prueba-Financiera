services:
  db:
    image: postgres:16
    container_name: financiera-db
    environment:
      POSTGRES_DB: ${DB_NAME:-prueba_financiera}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - financiera_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-prueba_financiera}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: financiera-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-prueba_financiera}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "8080:8080"

volumes:
  financiera_data:
